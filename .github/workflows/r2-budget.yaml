name: r2-budget

# R2 has no spending cap: tools/r2-budget.sh estimates the month's bill every
# 6 hours, alerts via ntfy from €5 and takes the public cache
# (cache.kleinbem.dev) offline from €15. Run by hand with "online" to bring
# the cache back.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      online:
        description: Bring the public cache back online
        type: boolean
        default: false
      dry_run:
        description: Only report, change nothing
        type: boolean
        default: false

permissions: {}

jobs:
  budget:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUDGET_TOKEN: ${{ secrets.R2_BUDGET_TOKEN }}
      NTFY_ALERT_TOPIC: ${{ secrets.NTFY_ALERT_TOPIC }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the R2 budget
        if: env.R2_BUDGET_TOKEN != '' && !inputs.online
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE_ALERT: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: tools/r2-budget.sh
      - name: Bring the cache back online
        if: env.R2_BUDGET_TOKEN != '' && inputs.online
        run: tools/r2-budget.sh --online
