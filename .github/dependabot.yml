version: 2
updates:
  # Keeps pinned actions current. One grouped PR a week instead of one per
  # action; the cooldown skips releases younger than a week.
  - package-ecosystem: github-actions
    directories: ["/"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Provider versions and the committed .terraform.lock.hcl of every infra
  # root. `opentofu`, not `terraform`: the roots run tofu and lock against
  # registry.opentofu.org.
  - package-ecosystem: opentofu
    directories:
      - /infra
      - /infra/garage
      - /infra/netbird
      - /infra/r2-tokens
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Majors come as one PR each, so a breaking provider can be closed
    # (ignored) without holding back the safe bumps. netbird is 0.0.x, where
    # a "patch" can change the schema.
    groups:
      providers:
        patterns: ["*"]
        exclude-patterns: ["netbirdio/netbird"]
        update-types: [minor, patch]

  # Go tools run via `go run` (stdlib only so far).
  - package-ecosystem: gomod
    directories: ["/tools/ai-logs", "/tools/workspace-indexer"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]
