# Replaces kleinbem/actions' lint/config/gitleaks.toml for this repo, so its
# allowlists are repeated here.
[extend]
useDefault = true

[[allowlists]]
description = "age public recipients and SSH key file names"
regexTarget = "match"
regexes = [
  '''age1(yubikey1)?[0-9a-z]{50,}''',
  '''id_(ed25519|ecdsa|rsa)[\w.-]*''',
]

[[allowlists]]
description = "sops ciphertext"
regexes = ['''ENC\[AES256_GCM,data:''']

# infra/personas.json is generated from nix-config's personas (lib/personas.nix)
# and JSON can't carry an inline gitleaks:allow. discord-id is a public Discord
# user id, not a client id or secret.
[[allowlists]]
description = "Discord user ids in the generated personas"
condition = "AND"
targetRules = ["discord-client-id"]
paths = ['''^infra/personas\.json$''']
regexTarget = "line"
regexes = ['''^\s*"discord-id": "\d+",?$''']
